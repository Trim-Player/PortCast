[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portcast"
version = "0.1.0"
description = "Reference implementation of the PortCast protocol — portable podcast subscriptions and listening history."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trimplayer" }]
keywords = ["podcast", "portcast", "opml", "interop", "protocol"]
dependencies = [
  "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
portcast = "portcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["portcast"]
