[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portcast-server"
version = "0.1.0"
description = "PortCast export server — exposes user data from third-party podcast platforms as PortCast documents over OAuth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Trimplayer" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "itsdangerous>=2.1",
  "portcast",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.20",
]

[tool.uv.sources]
portcast = { path = "../reference", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["portcast_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
