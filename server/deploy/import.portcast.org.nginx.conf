# Pre-certbot site config for import.portcast.org.
# Drop into /etc/nginx/sites-available/import.portcast.org and symlink
# into /etc/nginx/sites-enabled/. After `certbot --nginx -d
# import.portcast.org` succeeds it will inject the listen 443 / SSL
# block and the HTTP->HTTPS redirect server, matching the trimbrain
# site exactly.

server {
    server_name import.portcast.org;

    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
}
