<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="PortCast Export — T1: arrow on the crossbar">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB74D"/>
      <stop offset="100%" style="stop-color:#E65100"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="url(#bg1)"/>
  <g transform="translate(8,0)" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- T stem and original Trimplayer triangles preserved -->
    <line x1="25" y1="20" x2="25" y2="80"/>
    <path d="M30 20 L65 45 L30 45 Z" fill="white"/>
    <path d="M30 55 L65 55 L30 80 Z" fill="white"/>
    <!-- crossbar grown into an export arrow, exiting through the triangle gap -->
    <line x1="25" y1="50" x2="80" y2="50"/>
    <polyline points="72,42 82,50 72,58"/>
  </g>
</svg>
